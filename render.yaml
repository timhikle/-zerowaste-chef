services:
  - type: web
    name: zerowaste-chef
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: mixtral-8x7b-32768
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
